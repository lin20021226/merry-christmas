<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070512'/%3E%3Cpath d='M32 10 L37 27 L54 32 L37 37 L32 54 L27 37 L10 32 L27 27 Z' fill='%23c3a6ff'/%3E%3C/svg%3E">
    <title>忧郁水</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #070512;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; user-select: none;
        }

        /* 4:3 容器 */
        #canvas-wrapper {
            position: relative;
            box-shadow: 0 0 90px rgba(178, 140, 255, 0.18);
            background: #070512;
            overflow: hidden;
            border-radius: 4px;
        }

        #canvas-container { width: 100%; height: 100%; display: block; }

        /* 摄像头窗口 */
        #video-container {
            position: absolute; top: 20px; right: 20px; width: 160px; height: 120px; z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px; overflow: hidden;
            transform: scaleX(-1); /* 镜像翻转 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.8);
            transition: opacity 0.5s ease;
        }
        #input-video {
            width: 100%; height: 100%; object-fit: cover; opacity: 0.5;
            position: absolute; top: 0; left: 0;
        }
        #skeleton-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }

        /* UI 层 */
        #ui-layer {
            position: absolute; top: 40px; left: 40px; z-index: 3; pointer-events: none;
            color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            transition: opacity 0.5s;
        }

        h1 {
            font-weight: 200; letter-spacing: 6px; text-transform: uppercase; font-size: 2rem; margin: 0 0 15px 0;
            background: linear-gradient(to right, #ffd9a0, #ffb3d4, #c3a6ff, #9fd6ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .instructions {
            font-size: 0.85rem; color: #ddd; line-height: 1.8; max-width: 300px;
            background: rgba(18, 12, 32, 0.6); padding: 20px; border-radius: 12px;
            border-left: 2px solid #c3a6ff; backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .highlight { color: #e9c4ff; font-weight: 600; padding: 0 4px; }
        #status-text { margin-bottom: 12px; font-size: 1.1rem; color: #fff; font-weight: 500; display: flex; align-items: center; gap: 8px;}
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block;}

        /* 按钮 */
        #upload-btn {
            pointer-events: auto;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 12px 28px; cursor: pointer; text-transform: uppercase;
            font-size: 0.75rem; margin-top: 25px; transition: all 0.3s ease;
            letter-spacing: 2px; border-radius: 30px;
        }
        #upload-btn:hover { background: #fff; color: #070512; box-shadow: 0 0 25px rgba(195, 166, 255, 0.4); }
        #file-input { display: none; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #e9c4ff; font-size: 1rem; letter-spacing: 4px; z-index: 10;
            pointer-events: none; transition: opacity 0.5s; font-weight: 300;
        }

        /* 沉浸模式切换 */
        #fullscreen-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 20;
            background: rgba(0,0,0,0.3); color: #e9c4ff; border: 1px solid rgba(195, 166, 255, 0.3);
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        #fullscreen-btn:hover { background: #c3a6ff; color: #070512; border-color: #c3a6ff; }

        /* 隐藏 UI 状态 */
        .hide-ui #ui-layer,
        .hide-ui #video-container {
            opacity: 0; pointer-events: none;
        }
        .hide-ui #fullscreen-btn { opacity: 0.5; }
        .hide-ui #fullscreen-btn:hover { opacity: 1; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-wrapper">
        <div id="canvas-container"></div>

        <div id="video-container">
            <video id="input-video" autoplay playsinline muted></video>
            <canvas id="skeleton-canvas"></canvas>
        </div>

        <button id="fullscreen-btn" onclick="toggleUI()" title="切换沉浸模式">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
        </button>

        <div id="ui-layer">
            <h1>Merry Christmas</h1>
            <div id="status-text"><span class="status-dot" id="status-dot"></span><span id="status-msg">初始化引擎...</span></div>
            <div class="instructions">
                • <span class="highlight">握拳</span> : 聚合<br/>
                • <span class="highlight">张手</span> : 散开<br/>
                • <span class="highlight">挥动</span> : 旋转<br/>
                • <span class="highlight">捏合</span> : 抓取
            </div>
            <button id="upload-btn" onclick="document.getElementById('file-input').click()">上传纪念照片</button>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>
        <div id="loading">I LOVE YOU</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';

        // --- 全局配置 ---
        const CONFIG = {
            mainCount: 4800,    // 主体梦幻粒子数
            dustCount: 2200,    // 漂浮光尘数
            treeHeight: 75,
            maxRadius: 30,
            camDistance: 110,
            bloomStrength: 1.0,
            bloomThreshold: 0.3,
            bloomRadius: 0.65
        };

        const STATE = { TREE: 'tree', SCATTER: 'scatter', ZOOM: 'zoom' };
        let currentState = STATE.TREE;
        let targetState = STATE.TREE;

        // --- Three.js 变量 ---
        let scene, camera, renderer, composer;
        let mainGroup = new THREE.Group();
        let mainParticles, dustSystem;
        let photoMeshes = [];
        let zoomTargetIndex = -1;

        // --- 逻辑变量 ---
        let logicData = { main: [], dust: [], star: null };
        const _tempVec3 = new THREE.Vector3(); // 复用变量，减少GC
        let time = 0;

        // --- 交互变量 ---
        let handPos = { x: 0, y: 0 };
        let lastHandPos = { x: 0, y: 0 };
        let isHandPresent = false;
        let rotationVelocity = { x: 0, y: 0 }; // 物理惯性

        // --- UI 控制 ---
        window.toggleUI = function() {
            document.getElementById('canvas-wrapper').classList.toggle('hide-ui');
        };

        function updateStatus(msg, color = '#fff') {
            document.getElementById('status-msg').innerHTML = msg;
            document.getElementById('status-dot').style.background = color;
        }

        // --- 初始化场景 ---
        function initThree() {
            const wrapper = document.getElementById('canvas-wrapper');
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070512);
            scene.fog = new THREE.FogExp2(0x070512, 0.0018);

            updateDimensions(); // 计算初始尺寸

            camera = new THREE.PerspectiveCamera(50, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, CONFIG.camDistance);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", stencil: false });
            renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // 限制DPR以优化性能
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            container.appendChild(renderer.domElement);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

            // 灯光系统（主要作用于照片金属边框）
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
            scene.add(ambientLight);

            const warmLight = new THREE.SpotLight(0xffd9c0, 100);
            warmLight.position.set(30, 80, 50);
            warmLight.angle = Math.PI / 4;
            warmLight.penumbra = 1;
            scene.add(warmLight);

            const coolLight = new THREE.PointLight(0x88aaff, 50, 200);
            coolLight.position.set(-40, -20, 40);
            scene.add(coolLight);

            // 后处理辉光
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(wrapper.clientWidth, wrapper.clientHeight), CONFIG.bloomStrength, CONFIG.bloomRadius, CONFIG.bloomThreshold);

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createMainParticles();
            createDust();
            createStarField();
            createTreeStar();

            scene.add(mainGroup);
            window.addEventListener('resize', onWindowResize);
        }

        function updateDimensions() {
            const targetAspect = 4 / 3;
            const windowAspect = window.innerWidth / window.innerHeight;
            let width, height;

            if (windowAspect > targetAspect) {
                height = window.innerHeight;
                width = height * targetAspect;
            } else {
                width = window.innerWidth;
                height = width / targetAspect;
            }

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = width + 'px';
            wrapper.style.height = height + 'px';
            return { width, height };
        }

        // --- 梦幻粒子配色（自下而上：暖金 → 樱粉 → 薰衣草 → 冰蓝）---
        const COLOR_STOPS = [
            { t: 0.00, c: new THREE.Color(0xff9d5c) },
            { t: 0.35, c: new THREE.Color(0xd685ff) },
            { t: 0.70, c: new THREE.Color(0x907cff) },
            { t: 1.00, c: new THREE.Color(0x72c6ff) }
        ];
        const MINT = new THREE.Color(0x7cecc0);

        function gradientColor(normH, out) {
            for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
                const a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
                if (normH >= a.t && normH <= b.t) {
                    const k = (normH - a.t) / (b.t - a.t);
                    return out.copy(a.c).lerp(b.c, k);
                }
            }
            return out.copy(COLOR_STOPS[COLOR_STOPS.length - 1].c);
        }

        function randomSpherePoint(r) {
            const u = Math.random(), v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            return new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
        }

        // --- 主体梦幻粒子云 ---
        function createMainParticles() {
            const count = CONFIG.mainCount;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const phases = new Float32Array(count);
            const speeds = new Float32Array(count);
            const tmpColor = new THREE.Color();

            for (let i = 0; i < count; i++) {
                const h = Math.random() * CONFIG.treeHeight - CONFIG.treeHeight / 2;
                const normH = (h + CONFIG.treeHeight / 2) / CONFIG.treeHeight;
                // 树形：下宽上窄的柔和圆锥
                const rMax = CONFIG.maxRadius * (1 - normH) * 1.1;
                const r = Math.pow(Math.random(), 0.75) * rMax;
                const theta = Math.random() * Math.PI * 2;

                const treePos = new THREE.Vector3(r * Math.cos(theta), h, r * Math.sin(theta));
                const scatterPos = randomSpherePoint(40 + Math.random() * 50);

                // 高度渐变配色，少量薄荷点缀
                gradientColor(normH, tmpColor);
                if (Math.random() < 0.06) tmpColor.copy(MINT);

                const baseSize = 0.8 + Math.random() * 1.6;
                const phase = Math.random() * Math.PI * 2;
                const speed = 0.6 + Math.random() * 1.6;

                logicData.main.push({
                    treePos, scatterPos,
                    currentPos: treePos.clone(),
                    baseSize, phase, speed,
                    color: tmpColor.clone()
                });

                positions[i * 3] = treePos.x;
                positions[i * 3 + 1] = treePos.y;
                positions[i * 3 + 2] = treePos.z;
                colors[i * 3] = tmpColor.r;
                colors[i * 3 + 1] = tmpColor.g;
                colors[i * 3 + 2] = tmpColor.b;
                sizes[i] = baseSize;
                phases[i] = phase;
                speeds[i] = speed;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
            geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
            geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
            geo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));

            const mat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                uniforms: {
                    uTime: { value: 0 },
                    uPixelRatio: { value: Math.min(window.devicePixelRatio, 1.5) }
                },
                vertexShader: `
                    attribute vec3 aColor;
                    attribute float aSize;
                    attribute float aPhase;
                    attribute float aSpeed;
                    varying vec3 vColor;
                    varying float vPhase;
                    varying float vSpeed;
                    uniform float uTime;
                    uniform float uPixelRatio;
                    void main() {
                        vColor = aColor;
                        vPhase = aPhase;
                        vSpeed = aSpeed;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        float twinkle = 0.75 + 0.25 * sin(uTime * aSpeed + aPhase);
                        gl_PointSize = aSize * twinkle * uPixelRatio * (120.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vPhase;
                    varying float vSpeed;
                    uniform float uTime;
                    void main() {
                        vec2 uv = gl_PointCoord - 0.5;
                        float d = length(uv);
                        if (d > 0.5) discard;
                        float alpha = smoothstep(0.5, 0.05, d);
                        float core = smoothstep(0.18, 0.0, d);
                        float twinkle = 0.6 + 0.4 * sin(uTime * vSpeed + vPhase);
                        vec3 col = vColor * (0.65 + core * 0.2);
                        gl_FragColor = vec4(col, alpha * twinkle);
                    }
                `
            });

            mainParticles = new THREE.Points(geo, mat);
            mainParticles.frustumCulled = false;
            mainGroup.add(mainParticles);
        }

        // --- 漂浮光尘 ---
        function createDust() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(CONFIG.dustCount * 3);

            for (let i = 0; i < CONFIG.dustCount; i++) {
                const h = Math.random() * CONFIG.treeHeight - CONFIG.treeHeight / 2;
                const r = Math.random() * CONFIG.maxRadius + 5;
                const theta = Math.random() * Math.PI * 2;

                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);

                pos[i * 3] = x; pos[i * 3 + 1] = h; pos[i * 3 + 2] = z;

                logicData.dust.push({
                    treePos: new THREE.Vector3(x, h, z),
                    scatterPos: randomSpherePoint(70),
                    currentPos: new THREE.Vector3(x, h, z),
                    velocity: Math.random() * 0.05 + 0.02
                });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));

            const mat = new THREE.PointsMaterial({
                color: 0xd9bfff, size: 0.45, transparent: true, opacity: 0.5,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            dustSystem = new THREE.Points(geo, mat);
            dustSystem.frustumCulled = false;
            mainGroup.add(dustSystem);
        }

        // --- 远景星空 ---
        function createStarField() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for (let i = 0; i < 900; i++) {
                pos.push((Math.random() - 0.5) * 800, (Math.random() - 0.5) * 800, (Math.random() - 0.5) * 800);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            const stars = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x5a5578, size: 1.0, transparent: true, opacity: 0.6 }));
            scene.add(stars);
        }

        // --- 树顶发光星 ---
        function createTreeStar() {
            const starGeo = new THREE.OctahedronGeometry(3.0, 0);
            const starMat = new THREE.MeshPhysicalMaterial({
                color: 0xfff4e0, metalness: 0.6, roughness: 0.1, emissive: 0xfff0d0, emissiveIntensity: 1.5
            });
            const star = new THREE.Mesh(starGeo, starMat);
            star.userData = {
                treePos: new THREE.Vector3(0, CONFIG.treeHeight / 2 + 2.5, 0),
                scatterPos: new THREE.Vector3(0, 60, 0)
            };
            star.position.copy(star.userData.treePos);
            mainGroup.add(star);
            logicData.star = star;
        }

        // --- 核心动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 1. 更新主体梦幻粒子
            updateMainParticles();

            // 2. 更新光尘与照片
            updateDustLogic();
            updatePhotoLogic();

            // 3. 更新树顶星（位置过渡 + 呼吸脉动）
            if (logicData.star) {
                let target = currentState === STATE.TREE ? logicData.star.userData.treePos : logicData.star.userData.scatterPos;
                logicData.star.position.lerp(target, 0.05);
                logicData.star.rotation.y += 0.01;
                const pulse = 1 + 0.12 * Math.sin(time * 2);
                logicData.star.scale.setScalar(pulse);
            }

            // 4. 聚焦时背景粒子整体收小，突出照片
            const targetScale = currentState === STATE.ZOOM ? 0.6 : 1.0;
            mainParticles.scale.setScalar(THREE.MathUtils.lerp(mainParticles.scale.x, targetScale, 0.08));

            // 5. 全局旋转与惯性处理
            handlePhysicsRotation();

            composer.render();
        }

        function handlePhysicsRotation() {
            if (currentState === STATE.ZOOM) {
                // 缩放模式下停止旋转，方便观看
                rotationVelocity.x *= 0.8;
                rotationVelocity.y *= 0.8;
            } else if (currentState === STATE.SCATTER) {
                if (isHandPresent) {
                    const deltaX = handPos.x - lastHandPos.x;
                    const deltaY = handPos.y - lastHandPos.y;

                    // 增加灵敏度但限制最大速度
                    if (Math.abs(deltaX) > 0.001) rotationVelocity.y += deltaX * 0.2;
                    if (Math.abs(deltaY) > 0.001) rotationVelocity.x += deltaY * 0.1;

                    lastHandPos.x = handPos.x;
                    lastHandPos.y = handPos.y;
                }

                // 应用速度
                mainGroup.rotation.y += rotationVelocity.y;
                mainGroup.rotation.x += rotationVelocity.x;

                // 阻尼效果
                rotationVelocity.y *= 0.95;
                rotationVelocity.x *= 0.95;

                // 回正 X 轴
                mainGroup.rotation.x *= 0.98;
            } else {
                // 树形态自动旋转
                mainGroup.rotation.y += 0.004;
                mainGroup.rotation.x *= 0.95;
            }
        }

        function updateMainParticles() {
            const positions = mainParticles.geometry.attributes.position.array;
            const isTree = currentState === STATE.TREE;
            const isZoom = currentState === STATE.ZOOM;
            const data = logicData.main;

            for (let i = 0; i < data.length; i++) {
                const item = data[i];
                let target = isTree ? item.treePos : item.scatterPos;
                if (isZoom) target = item.scatterPos; // 聚焦时背景保持散开

                // 散开时的上下呼吸浮动
                if (!isTree) item.currentPos.y += Math.sin(time + i * 0.1) * 0.01;

                // 位置插值
                item.currentPos.lerp(target, 0.08);

                positions[i * 3] = item.currentPos.x;
                positions[i * 3 + 1] = item.currentPos.y;
                positions[i * 3 + 2] = item.currentPos.z;
            }
            mainParticles.geometry.attributes.position.needsUpdate = true;
            mainParticles.material.uniforms.uTime.value = time;
        }

        function updateDustLogic() {
            const positions = dustSystem.geometry.attributes.position.array;
            const isTree = currentState === STATE.TREE;

            for (let i = 0; i < logicData.dust.length; i++) {
                const item = logicData.dust[i];

                if (isTree) {
                    // 树形态：粒子向上流动并限制在圆锥内
                    item.currentPos.y += item.velocity;
                    if (item.currentPos.y > CONFIG.treeHeight / 2) item.currentPos.y = -CONFIG.treeHeight / 2;

                    const rMax = CONFIG.maxRadius * (1 - (item.currentPos.y + CONFIG.treeHeight / 2) / CONFIG.treeHeight) + 5;
                    const rCurr = Math.sqrt(item.currentPos.x ** 2 + item.currentPos.z ** 2);
                    if (rCurr > rMax) {
                        item.currentPos.x *= 0.95;
                        item.currentPos.z *= 0.95;
                    }
                } else {
                    // 散开形态：飞向随机点
                    item.currentPos.lerp(item.scatterPos, 0.05);
                }

                positions[i * 3] = item.currentPos.x;
                positions[i * 3 + 1] = item.currentPos.y;
                positions[i * 3 + 2] = item.currentPos.z;
            }
            dustSystem.geometry.attributes.position.needsUpdate = true;
        }

        function updatePhotoLogic() {
            _tempVec3.copy(camera.position).applyMatrix4(mainGroup.matrixWorld.clone().invert());

            photoMeshes.forEach((mesh, idx) => {
                let targetPos, targetScale = 2.0;

                if (currentState === STATE.ZOOM && idx === zoomTargetIndex) {
                    const camFront = new THREE.Vector3(0, 0, 80);
                    camFront.applyMatrix4(camera.matrixWorld);
                    targetPos = mainGroup.worldToLocal(camFront);
                    targetScale = 5.0;
                    mesh.lookAt(camera.position);
                } else {
                    targetPos = currentState === STATE.TREE ? mesh.userData.treePos : mesh.userData.scatterPos;
                    if (currentState !== STATE.TREE) mesh.position.y += Math.sin(time + idx) * 0.02;

                    if (currentState === STATE.SCATTER) targetScale = 3.0;

                    if (currentState === STATE.TREE) {
                        mesh.rotation.copy(mesh.userData.baseRot);
                        mesh.rotation.y += 0.01;
                    } else {
                        mesh.lookAt(camera.position);
                    }
                }

                mesh.position.lerp(targetPos, 0.1);

                const currentScale = mesh.scale.x;
                const newScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.1);
                mesh.scale.setScalar(newScale);
            });
        }

        // --- 交互系统 (MediaPipe) ---
        async function setupMediaPipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
                const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO", numHands: 1
                });

                const video = document.getElementById("input-video");
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;

                video.addEventListener("loadeddata", () => {
                    document.getElementById('loading').style.display = 'none';
                    updateStatus("系统就绪，请伸手", "#0f0");
                    predictWebcam(handLandmarker, video);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('loading').style.display = 'none';
                updateStatus("无法访问摄像头，仅展示粒子场景", "#f00");
            }
        }

        let lastVideoTime = -1;
        let lastPredictionTime = 0;
        const PREDICTION_INTERVAL = 50; // 限制手势检测频率 (ms) -> 20 FPS

        async function predictWebcam(handLandmarker, video) {
            const now = performance.now();

            // 节流：如果是同一帧或者时间间隔太短，跳过检测
            if (video.currentTime !== lastVideoTime && (now - lastPredictionTime > PREDICTION_INTERVAL)) {
                lastVideoTime = video.currentTime;
                lastPredictionTime = now;

                const result = handLandmarker.detectForVideo(video, now);
                drawAndProcess(video, result);
            }
            requestAnimationFrame(() => predictWebcam(handLandmarker, video));
        }

        function drawAndProcess(video, result) {
            const canvas = document.getElementById('skeleton-canvas');
            const ctx = canvas.getContext('2d');

            // 确保画布尺寸匹配
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (result.landmarks && result.landmarks.length > 0) {
                const landmarks = result.landmarks[0];
                isHandPresent = true;
                drawSkeleton(ctx, landmarks, canvas.width, canvas.height);
                handleGesture(landmarks);
            } else {
                isHandPresent = false;
            }
        }

        function drawSkeleton(ctx, landmarks, w, h) {
            ctx.lineWidth = 3; ctx.strokeStyle = '#00ff88'; ctx.fillStyle = '#ff0044';
            const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

            ctx.beginPath();
            for (let c of connections) {
                const s = landmarks[c[0]];
                const e = landmarks[c[1]];
                ctx.moveTo(s.x * w, s.y * h); ctx.lineTo(e.x * w, e.y * h);
            }
            ctx.stroke();

            // 关键点
            for (let p of landmarks) {
                ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 3, 0, 2 * Math.PI); ctx.fill();
            }
        }

        function handleGesture(landmarks) {
            // 计算手掌中心
            const palmX = 1 - (landmarks[0].x + landmarks[9].x) / 2; // 镜像翻转 X
            const palmY = (landmarks[0].y + landmarks[9].y) / 2;

            // 平滑位置
            handPos.x = handPos.x * 0.7 + palmX * 0.3;
            handPos.y = handPos.y * 0.7 + palmY * 0.3;

            // 简单的手势判定算法
            let folded = 0;
            const tips = [8, 12, 16, 20];
            const bases = [5, 9, 13, 17];

            // 指尖到指根距离判定握拳
            tips.forEach((tipIdx) => {
                const d = Math.sqrt(
                    Math.pow(landmarks[tipIdx].x - landmarks[0].x, 2) +
                    Math.pow(landmarks[tipIdx].y - landmarks[0].y, 2)
                );
                if (d < 0.25) folded++;
            });

            // 捏合检测 (食指拇指距离)
            const dPinch = Math.sqrt(
                Math.pow(landmarks[4].x - landmarks[8].x, 2) +
                Math.pow(landmarks[4].y - landmarks[8].y, 2)
            );

            const isPinch = dPinch < 0.08;
            const isFist = folded >= 3;
            const isOpen = !isFist && !isPinch;

            // 状态机
            if (isPinch && currentState === STATE.SCATTER) {
                if (photoMeshes.length > 0) {
                    switchToZoom();
                    updateStatus("抓取照片: 聚焦回忆", "#ffd700");
                } else {
                    updateStatus("请先点击左上角上传照片", "#aaa");
                }
            } else if (isFist) {
                currentState = STATE.TREE;
                zoomTargetIndex = -1;
                rotationVelocity.x = 0; rotationVelocity.y = 0;
                updateStatus("握拳: 聚合粒子树", "#0f0");
            } else if (isOpen) {
                if (currentState === STATE.ZOOM && !isPinch) {
                    currentState = STATE.SCATTER;
                    zoomTargetIndex = -1;
                } else if (currentState === STATE.TREE) {
                    currentState = STATE.SCATTER;
                    // 重置惯性位置避免跳变
                    lastHandPos.x = handPos.x; lastHandPos.y = handPos.y;
                }
                updateStatus("张手: 梦幻星云 (挥手旋转)", "#9fd6ff");
            }
        }

        function switchToZoom() {
            currentState = STATE.ZOOM;
            targetState = STATE.ZOOM;

            // 智能选择逻辑：选离镜头最近的照片
            if (zoomTargetIndex === -1 && photoMeshes.length > 0) {
                let minDist = Infinity;
                let bestIdx = 0;
                const camPos = camera.position;
                const worldPos = new THREE.Vector3();

                photoMeshes.forEach((mesh, idx) => {
                    mesh.getWorldPosition(worldPos);
                    const d = worldPos.distanceTo(camPos);
                    if (d < minDist) {
                        minDist = d;
                        bestIdx = idx;
                    }
                });
                zoomTargetIndex = bestIdx;
            }
        }

        function onWindowResize() {
            const dims = updateDimensions();
            camera.aspect = dims.width / dims.height;
            camera.updateProjectionMatrix();
            renderer.setSize(dims.width, dims.height);
            composer.setSize(dims.width, dims.height);
        }

        // --- 照片上传处理 ---
        document.getElementById('file-input').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;

            let loadedCount = 0;
            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.src = evt.target.result;
                    img.onload = () => {
                        addPhotoMesh(img);
                        loadedCount++;
                        updateStatus(`已加载 ${loadedCount} 张照片`, "#fff");
                    }
                }
                reader.readAsDataURL(files[i]);
            }
        });

        function addPhotoMesh(img) {
            const tex = new THREE.Texture(img);
            tex.needsUpdate = true;
            tex.colorSpace = THREE.SRGBColorSpace;

            // 保持比例
            let w = 4, h = 4;
            if (img.width > img.height) h = 4 * (img.height / img.width);
            else w = 4 * (img.width / img.height);

            const geo = new THREE.PlaneGeometry(w, h);
            const mat = new THREE.MeshBasicMaterial({
                map: tex, side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, mat);

            // 金色边框
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(w + 0.2, h + 0.2, 0.1),
                new THREE.MeshPhysicalMaterial({ color: 0xffd700, roughness: 0.2, metalness: 1 })
            );
            frame.position.z = -0.06;
            mesh.add(frame);

            // 随机分布
            const h_pos = (Math.random() - 0.5) * CONFIG.treeHeight;
            const normH = (h_pos + CONFIG.treeHeight / 2) / CONFIG.treeHeight;
            const maxR = CONFIG.maxRadius * (1 - normH) + 2;

            const r = maxR * (0.6 + 0.4 * Math.random());
            const theta = Math.random() * Math.PI * 2;

            const treePos = new THREE.Vector3(r * Math.cos(theta), h_pos, r * Math.sin(theta));
            const scatterPos = randomSpherePoint(60);

            mesh.userData = {
                treePos,
                scatterPos,
                baseRot: new THREE.Euler(0, theta + Math.PI / 2, 0) // 面向外部
            };
            mesh.position.copy(treePos);
            mesh.lookAt(new THREE.Vector3(0, h_pos, 0)); // 树状态下初始朝向中心

            photoMeshes.push(mesh);
            mainGroup.add(mesh);
        }

        // 启动
        initThree();
        animate();
        setupMediaPipe();

        // 兜底：3 秒后摄像头仍未就绪则淡出加载遮罩
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading) loading.style.opacity = '0';
        }, 3000);
    </script>
</body>
</html>
